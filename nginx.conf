events {
    worker_connections 2048;
}

http {
    upstream signature_cluster {
        least_conn;
        server signature-node-1:8080 max_fails=2 fail_timeout=5s;
        server signature-node-2:8080 max_fails=2 fail_timeout=5s;
        server signature-node-3:8080 max_fails=2 fail_timeout=5s;
        server signature-node-4:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://signature_cluster;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
