events { worker_connections 1024; }

http {
    upstream signature_cluster {
        # Thuật toán thông minh: Đẩy request vào container đang rảnh nhất
        least_conn;

        # Tên service trong docker-compose
        server signature-node:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://signature_cluster;
            proxy_http_version 1.1;

            # Tắt buffer để phản hồi ngay lập tức
            proxy_buffering off;

            # Thiết lập timeout hợp lý
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
