version: "3.8"

services:
  # Node 1: Chromium Instance 1
  signature-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-signature-node-1
    init: true                      # <--- BẮT BUỘC: Docker tự dọn sạch 100% zombie process
    shm_size: "1gb"
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - MAX_GENERATIONS_BEFORE_REFRESH=500
      - MAX_SESSION_AGE_MS=1800000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M             # Nâng lên 1.5GB để khi restart không bị nghẽn RAM ảo
          pids: 4096

  # Node 2: Chromium Instance 2
  signature-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-signature-node-2
    init: true                      # <--- BẮT BUỘC
    shm_size: "1gb"
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - MAX_GENERATIONS_BEFORE_REFRESH=500
      - MAX_SESSION_AGE_MS=1800000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M
          pids: 4096

  # Node 3: Chromium Instance 3
  signature-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-signature-node-3
    init: true                      # <--- BẮT BUỘC
    shm_size: "1gb"
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
