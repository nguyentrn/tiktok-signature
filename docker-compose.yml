version: "3.8"

services:
  # 1. Cụm Signature Server (chạy ngầm bên trong, không mở port trực tiếp ra ngoài)
  signature-node:
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: "1gb" # CỰC KỲ QUAN TRỌNG: Cấp đủ share memory để Chromium không crash
    environment:
      - PORT=8080
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M # Chống tràn RAM máy chủ

  # 2. Cổng tiếp nhận (Load Balancer)
  signature-gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80" # Worker bên ngoài chỉ cần gọi vào cổng 8080 này
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - signature-node
