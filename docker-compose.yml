services:
  signature-node-1:
    build: .
    shm_size: "1gb"
    environment:
      - PORT=8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M

  signature-node-2:
    build: .
    shm_size: "1gb"
    environment:
      - PORT=8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M

  signature-node-3:
    build: .
    shm_size: "1gb"
    environment:
      - PORT=8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M

  signature-node-4:
    build: .
    shm_size: "1gb"
    environment:
      - PORT=8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M

  signature-gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - signature-node-1
      - signature-node-2
      - signature-node-3
      - signature-node-4
