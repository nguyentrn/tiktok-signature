version: "3.8"

services:
  # Node 1: Chromium Instance 1
  signature-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-signature-node-1
    shm_size: "1gb" # Cấp đủ share memory chống crash tab Chromium
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - MAX_GENERATIONS_BEFORE_REFRESH=500
      - MAX_SESSION_AGE_MS=1800000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 850M

  # Node 2: Chromium Instance 2
